<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Project Assessments | SOTE</title><link rel="stylesheet" href="assets/css/styles.css"><style>.psa{max-width:960px;margin:auto;padding:24px 16px}.psa nav,.psa .actions{display:flex;gap:10px;flex-wrap:wrap;margin:16px 0}.psa button,.psa select,.psa input,.psa textarea{font:inherit;padding:12px;border-radius:8px;min-height:44px;max-width:100%}.psa button{cursor:pointer}.psa label{display:block;margin:14px 0 5px}.psa textarea{width:100%;min-height:90px;box-sizing:border-box}.psa article{border:1px solid #758891;border-radius:12px;padding:18px;margin:16px 0}.psa p{overflow-wrap:anywhere}.psa .muted{opacity:.8}.psa .message{padding:14px;border:1px solid #77939d;border-radius:8px;white-space:pre-wrap}.psa [hidden]{display:none!important}.psa fieldset{border:0;padding:0}.psa input[type=checkbox]{min-height:22px}.psa a{overflow-wrap:anywhere}@media(max-width:500px){.psa .actions button{flex:1 1 100%}}@media print{header,nav,button,form,.no-print{display:none!important}.psa{color:#000;background:#fff}}</style></head><body><header class="site-header"></header><main class="psa"><a href="operator.html">← Operator workspace</a><p class="eyebrow" id="lane">SOTE / My Missions</p><h1>Project Assessments</h1><p>Review the current findings, add evidence and keep the next move clear.</p><p id="message" class="message" role="status" aria-live="polite">Connecting to the authenticated assessment service…</p><a id="login" hidden href="/api/md-psa/login" class="button">Sign in with GitHub</a><section id="workspace" hidden><nav><label>Assessment <select id="assessment"></select></label><button id="reload">Refresh</button><a id="pdf">Download PDF</a><a id="markdown">Download Markdown</a></nav><div id="director" hidden><div class="actions"><button id="new">Start assessment</button><button id="request">Request operator review</button><button id="publish">Publish final assessment</button></div><form id="new-form" hidden><label>Assessment identifier<input id="new-id" required pattern="MD-PSA-\d{4}-\d{2}-\d{2}-\d{3}" placeholder="MD-PSA-YYYY-MM-DD-001"></label><p>Select active missions.</p><button type="button" id="all">Select all</button><div id="mission-options"></div><button>Create assessment</button></form></div><div id="summary"></div><nav><button id="previous">Previous mission</button><span id="position"></span><button id="next">Next mission</button><button id="living">View living report</button></nav><div id="items"></div><section id="report" hidden></section><section id="field"></section><label>Compare with previous assessment<select id="compare"><option value="">Choose an assessment</option></select></label><div id="changes"></div></section></main><script src="assets/js/main.js"></script><script src="assets/js/navigation-v2.js"></script><script type="module" src="assets/js/project-assessments.js"></script></body></html>
