name: Normalize Site Header
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ensure shared navigation script loads on every HTML page
        run: |
          python - <<'PY'
          from pathlib import Path
          for p in Path('.').rglob('*.html'):
              if '.git' in p.parts: continue
              s=p.read_text(encoding='utf-8')
              if 'assets/js/main.js' in s: continue
              prefix='../'*len(p.parent.parts)
              tag=f'<script src="{prefix}assets/js/main.js"></script>'
              if '</body>' in s:
                  p.write_text(s.replace('</body>',tag+'</body>',1),encoding='utf-8')
                  print('normalized',p)
          PY
      - name: Commit normalized headers
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Normalize global header across site"
          git push
